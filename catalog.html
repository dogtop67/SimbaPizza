<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(to top, #A2D7B0 20%, #2ECC71 100%);
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
    }
    header {
      position: relative;
      margin-bottom: 40px;
    }
    h1 {
      text-align: center;
      font-size: 50px;
      margin: 0;
    }
    .back-button {
      position: absolute;
      top: 10px;
      left: 10px;
      text-decoration: none;
      color: #ffffff;
      padding: 15px 30px;
      background-color: green;
      border-radius: 8px;
      transition: all 0.4s;
      display: inline-block;
    }
    .back-button:hover {
      background-color: #36a73d;
    }
    .pizza-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center; 
      gap: 30px; 
      max-width: 1800px;
      margin: 0 auto;
    }
    .pizza-card {
      padding: 15px;
      width: 430px; 
      display: flex;
      flex-direction: column;
      align-items: flex-start; 
    }
    .pizza-card img {
      width: 100%; 
      height: auto;
      display: block;
      background-color: white; 
    }
    .pizza-info {
      width: 100%;
      display: flex;
      justify-content: space-between; 
      margin-top: 15px;
    }
    .pizza-text h2 {
      font-size: 24px;
      margin: 5px 0;
    }
    .order-button {
      color: white;
      background-color: green;
      padding: 15px 25px;
      text-decoration: none;
      font-size: 27px;
      transition: background-color 0.3s;
    }
    .order-button:hover {
      background-color: #36a73d;
    }
    @media (max-width: 480px) {
      .pizza-card {
        width: 100%; 
      }
      h1 {
        font-size: 36px;
        margin-top: 60px; 
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="https://dogtop67.github.io/SimbaPizza/#" class="back-button">←</a>
    <h1>Каталог</h1>
  </header>
  <main class="pizza-container">
    <div class="pizza-card">
      <img src="https://caponepizza.kiev.ua/wp-content/uploads/2023/03/img_2308.jpeg" alt="Піца 4 сира">
      <div class="pizza-info">
        <div class="pizza-text">
          <h2>Піца 4 сира</h2>
          <h2>130 грн</h2>
        </div>
        <a href="zamovlena.html" class="order-button">Замовити</a>
      </div>
    </div>
    <div class="pizza-card">
      <img src="https://cipollino.ua/content/uploads/images/pytstsa-tsezar-svezhest-khrustiashchest-y-sytost-cipollino.jpg" alt="Піца цезар">
      <div class="pizza-info">
        <div class="pizza-text">
          <h2>Піца цезар</h2>
          <h2>150 грн</h2>
        </div>
        <a href="zamovlena.html" class="order-button">Замовити</a>
      </div>
    </div>
    <div class="pizza-card">
      <img src="https://uzetut.com/image/cache/catalog/picasaljami-500x500.jpg" alt="Піца салямі">
      <div class="pizza-info">
        <div class="pizza-text">
          <h2>Піца салямі</h2>
          <h2>140 грн</h2>
        </div>
        <a href="zamovlena.html" class="order-button">Замовити</a>
      </div>
    </div>
    <div class="pizza-card">
      <img src="https://ecopizza.com.ua/570-large_default/pica-gavajska.jpg" alt="Гавайська Піца">
      <div class="pizza-info">
        <div class="pizza-text">
          <h2>Гавайська Піца</h2>
          <h2>120 грн</h2>
        </div>
        <a href="zamovlena.html" class="order-button">Замовити</a>
      </div>
    </div>
  </main>
</body>
</html>
